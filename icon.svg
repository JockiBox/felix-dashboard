<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient - warm gold -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="50%" style="stop-color:#B8935A"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d23"/>
      <stop offset="100%" style="stop-color:#2a2d33"/>
    </linearGradient>

    <!-- Shine effect -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Inner glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#mainGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Main "F" letterform - elegant serif style -->
  <g transform="translate(256, 256)">
    <!-- F letter - custom elegant design -->
    <path d="
      M -60 -100
      L -60 100
      L -30 100
      L -30 10
      L 50 10
      L 50 -15
      L -30 -15
      L -30 -70
      L 70 -70
      L 70 -100
      Z
    " fill="url(#mainGrad)" filter="url(#glow)"/>

    <!-- Decorative dot/orb representing AI -->
    <circle cx="55" cy="-85" r="18" fill="url(#mainGrad)"/>
    <circle cx="55" cy="-85" r="12" fill="#1a1d23"/>
    <circle cx="55" cy="-85" r="6" fill="url(#mainGrad)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle orbital rings representing organization/productivity -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.3" transform="rotate(-20, 256, 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="45" fill="none" stroke="url(#mainGrad)" stroke-width="1" opacity="0.2" transform="rotate(15, 256, 256)"/>

  <!-- Shine overlay -->
  <ellipse cx="200" cy="180" rx="120" ry="80" fill="url(#shine)" opacity="0.4"/>

  <!-- Small accent dots -->
  <circle cx="380" cy="180" r="4" fill="#D4A853" opacity="0.8"/>
  <circle cx="400" cy="220" r="3" fill="#D4A853" opacity="0.6"/>
  <circle cx="130" cy="340" r="3" fill="#D4A853" opacity="0.5"/>
</svg>
