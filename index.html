<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1d23">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Felix — Inbox Zero</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1d23;
            --bg-secondary: #22262f;
            --bg-tertiary: #2a2f3a;
            --bg-elevated: #353b48;
            --text-primary: #f5f5f5;
            --text-secondary: #a8b2c1;
            --text-muted: #6b7280;
            --accent-warm: #b8935a;
            --accent-gold: #d4a853;
            --accent-success: #4ade80;
            --accent-danger: #ef4444;
            --accent-info: #60a5fa;
            --accent-purple: #a78bfa;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Main Content */
        .main-content {
            padding: 24px 32px;
            overflow-y: auto;
            max-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 48px;
            height: 48px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Inbox Zero Progress */
        .inbox-zero-card {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--bg-elevated);
        }

        .inbox-zero-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .inbox-zero-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .inbox-zero-count {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .inbox-zero-count.zero {
            color: var(--accent-success);
        }

        .inbox-zero-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .inbox-zero-progress {
            height: 8px;
            background: var(--bg-elevated);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 16px;
        }

        .inbox-zero-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-success));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .inbox-zero-stats {
            display: flex;
            gap: 24px;
            margin-top: 16px;
        }

        .inbox-zero-stat {
            text-align: center;
        }

        .inbox-zero-stat-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .inbox-zero-stat-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Quick Filters */
        .quick-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--bg-elevated);
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-warm);
        }

        .filter-btn.active {
            background: var(--accent-warm);
            border-color: var(--accent-warm);
            color: var(--bg-primary);
        }

        .filter-btn .count {
            background: var(--bg-elevated);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }

        .filter-btn.active .count {
            background: rgba(0,0,0,0.2);
        }

        /* Email List */
        .email-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .email-list {
            max-height: calc(100vh - 380px);
            overflow-y: auto;
        }

        .email-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--bg-tertiary);
            cursor: pointer;
            transition: background 0.15s;
        }

        .email-item:hover {
            background: var(--bg-tertiary);
        }

        .email-item.tagged-respond {
            border-left: 3px solid var(--accent-gold);
        }

        .email-item.tagged-important {
            border-left: 3px solid var(--accent-danger);
        }

        .email-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--bg-elevated);
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .email-checkbox:hover {
            border-color: var(--accent-warm);
        }

        .email-checkbox.checked {
            background: var(--accent-success);
            border-color: var(--accent-success);
        }

        .email-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }

        .email-content {
            flex: 1;
            min-width: 0;
        }

        .email-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .email-sender {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .email-time {
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .email-subject {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }

        .email-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .email-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .email-tag.respond {
            background: rgba(212, 168, 83, 0.2);
            color: var(--accent-gold);
        }

        .email-tag.important {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-danger);
        }

        .email-tag.saved {
            background: rgba(96, 165, 250, 0.2);
            color: var(--accent-info);
        }

        /* Email Actions */
        .email-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .email-item:hover .email-actions {
            opacity: 1;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-danger);
        }

        .action-btn.archive:hover {
            background: rgba(74, 222, 128, 0.2);
            color: var(--accent-success);
        }

        .action-btn.tag:hover {
            background: rgba(212, 168, 83, 0.2);
            color: var(--accent-gold);
        }

        .action-btn.save:hover {
            background: rgba(96, 165, 250, 0.2);
            color: var(--accent-info);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Tag Dropdown */
        .tag-dropdown {
            position: relative;
        }

        .tag-dropdown-content {
            display: none;
            position: absolute;
            bottom: 100%;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--bg-elevated);
            border-radius: var(--radius-md);
            min-width: 160px;
            z-index: 100;
            margin-bottom: 4px;
            box-shadow: var(--shadow-soft);
        }

        .tag-dropdown:hover .tag-dropdown-content {
            display: block;
        }

        .tag-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .tag-option:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .tag-option:first-child {
            border-radius: var(--radius-md) var(--radius-md) 0 0;
        }

        .tag-option:last-child {
            border-radius: 0 0 var(--radius-md) var(--radius-md);
        }

        /* Load More */
        .load-more-btn {
            width: 100%;
            padding: 16px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:hover {
            background: var(--bg-elevated);
            color: var(--accent-warm);
        }

        /* Empty State */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--accent-success);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Chat Sidebar */
        .chat-sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--bg-tertiary);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .chat-header h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-header p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .chat-message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.felix {
            display: flex;
            gap: 12px;
        }

        .chat-message.user {
            display: flex;
            justify-content: flex-end;
        }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-warm));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.5;
        }

        .chat-message.felix .chat-bubble {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .chat-message.user .chat-bubble {
            background: var(--accent-warm);
            color: var(--bg-primary);
        }

        .chat-input-container {
            padding: 16px;
            border-top: 1px solid var(--bg-tertiary);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 8px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            padding: 4px;
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-send-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent-warm);
            color: var(--bg-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }

        .chat-send-btn:hover {
            transform: scale(1.05);
        }

        /* Quick Commands */
        .quick-commands {
            padding: 12px 16px;
            border-top: 1px solid var(--bg-tertiary);
        }

        .quick-commands-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .quick-commands-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .quick-cmd {
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .quick-cmd:hover {
            background: var(--bg-elevated);
            color: var(--accent-warm);
        }

        /* Saved Emails Panel */
        .saved-panel {
            padding: 16px;
            border-top: 1px solid var(--bg-tertiary);
            max-height: 200px;
            overflow-y: auto;
        }

        .saved-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .saved-panel-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .export-btn {
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: var(--radius-sm);
            color: var(--accent-info);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .export-btn:hover {
            background: rgba(96, 165, 250, 0.2);
        }

        .saved-email-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            font-size: 12px;
        }

        .saved-email-item span {
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .remove-saved {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .remove-saved:hover {
            color: var(--accent-danger);
        }

        /* Rules Created Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            border: 1px solid var(--accent-success);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-primary);
            display: none;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .toast.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            .chat-sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <img src="/icon.svg" alt="Felix" class="logo">
                    <div class="header-title">
                        <h1>Felix</h1>
                        <p id="current-date">Loading...</p>
                    </div>
                </div>
            </header>

            <!-- Inbox Zero Progress -->
            <div class="inbox-zero-card">
                <div class="inbox-zero-header">
                    <span class="inbox-zero-title">Inbox Zero Progress</span>
                    <span id="inbox-zero-percent" style="color: var(--accent-gold); font-weight: 600;">--</span>
                </div>
                <div class="inbox-zero-count" id="unread-count">--</div>
                <div class="inbox-zero-label">unread emails remaining</div>
                <div class="inbox-zero-progress">
                    <div class="inbox-zero-progress-bar" id="progress-bar" style="width: 0%"></div>
                </div>
                <div class="inbox-zero-stats">
                    <div class="inbox-zero-stat">
                        <div class="inbox-zero-stat-value" id="processed-today">0</div>
                        <div class="inbox-zero-stat-label">Processed Today</div>
                    </div>
                    <div class="inbox-zero-stat">
                        <div class="inbox-zero-stat-value" id="respond-count">0</div>
                        <div class="inbox-zero-stat-label">Need Response</div>
                    </div>
                    <div class="inbox-zero-stat">
                        <div class="inbox-zero-stat-value" id="important-count">0</div>
                        <div class="inbox-zero-stat-label">Important</div>
                    </div>
                </div>
            </div>

            <!-- Quick Filters -->
            <div class="quick-filters">
                <button class="filter-btn active" onclick="setFilter('all')" id="filter-all">
                    All <span class="count" id="filter-all-count">0</span>
                </button>
                <button class="filter-btn" onclick="setFilter('respond')" id="filter-respond">
                    🔔 Respond Today <span class="count" id="filter-respond-count">0</span>
                </button>
                <button class="filter-btn" onclick="setFilter('important')" id="filter-important">
                    ⭐ Important <span class="count" id="filter-important-count">0</span>
                </button>
                <button class="filter-btn" onclick="setFilter('saved')" id="filter-saved">
                    💾 Saved <span class="count" id="filter-saved-count">0</span>
                </button>
            </div>

            <!-- Email List -->
            <section class="email-section">
                <div class="email-list" id="email-list">
                    <!-- Emails will be rendered here -->
                </div>
                <button class="load-more-btn" id="load-more-btn" onclick="loadMoreEmails()" style="display: none;">
                    Load More
                </button>
            </section>
        </main>

        <!-- Chat Sidebar -->
        <aside class="chat-sidebar">
            <div class="chat-header">
                <h2>Chat with Felix</h2>
                <p>Tell me what to do with your emails</p>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- Messages will be rendered here -->
            </div>

            <!-- Saved Emails Panel -->
            <div class="saved-panel" id="saved-panel" style="display: none;">
                <div class="saved-panel-header">
                    <span class="saved-panel-title">📁 Saved Emails</span>
                    <button class="export-btn" onclick="exportSavedEmails()">Export to File</button>
                </div>
                <div id="saved-emails-list">
                    <!-- Saved emails will be rendered here -->
                </div>
            </div>

            <!-- Quick Commands -->
            <div class="quick-commands">
                <div class="quick-commands-title">Quick Commands</div>
                <div class="quick-commands-list">
                    <button class="quick-cmd" onclick="sendQuickCmd('Delete all newsletters')">Delete newsletters</button>
                    <button class="quick-cmd" onclick="sendQuickCmd('Archive all read emails')">Archive read</button>
                    <button class="quick-cmd" onclick="sendQuickCmd('Auto-delete emails from promotions')">Block promos</button>
                    <button class="quick-cmd" onclick="sendQuickCmd('Show me what needs a response')">Need response</button>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chat-input" placeholder="Tell Felix what to do..." onkeypress="handleChatKeyPress(event)">
                    <button class="chat-send-btn" onclick="sendChat()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-success)" stroke-width="2" width="20" height="20">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span id="toast-message">Done!</span>
    </div>

    <script>
        const API_BASE = 'http://localhost:3847/api';

        // State
        let currentEmails = [];
        let emailOffset = 0;
        let totalUnread = 0;
        let currentFilter = 'all';
        let taggedEmails = JSON.parse(localStorage.getItem('felixTags') || '{}');
        let savedEmails = JSON.parse(localStorage.getItem('felixSaved') || '[]');
        let processedToday = parseInt(localStorage.getItem('felixProcessedToday') || '0');
        let lastProcessedDate = localStorage.getItem('felixProcessedDate');

        // Reset daily counter
        const today = new Date().toDateString();
        if (lastProcessedDate !== today) {
            processedToday = 0;
            localStorage.setItem('felixProcessedToday', '0');
            localStorage.setItem('felixProcessedDate', today);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            updateDate();
            loadEmails();
            renderSavedEmails();
            addFelixMessage("Hi! I'm Felix, your inbox assistant. Tell me what to do with your emails — like 'delete all newsletters' or 'auto-archive emails from LinkedIn'. I'll set up the rules automatically.");
        });

        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', options);
        }

        // Email Loading
        async function loadEmails() {
            try {
                const res = await fetch(`${API_BASE}/emails/unread?limit=50&offset=${emailOffset}`);
                const data = await res.json();

                if (data.success) {
                    if (emailOffset === 0) {
                        currentEmails = data.emails;
                    } else {
                        currentEmails = [...currentEmails, ...data.emails];
                    }
                    totalUnread = data.total;
                    updateInboxZeroProgress();
                    renderEmails();
                    updateFilterCounts();

                    // Show/hide load more
                    const loadMoreBtn = document.getElementById('load-more-btn');
                    loadMoreBtn.style.display = currentEmails.length < data.total ? 'block' : 'none';
                    loadMoreBtn.textContent = `Load More (${data.total - currentEmails.length} remaining)`;
                }
            } catch (e) {
                console.error('Failed to load emails:', e);
                document.getElementById('email-list').innerHTML = `
                    <div class="empty-state">
                        <p>Could not connect to Felix server. Make sure it's running on port 3847.</p>
                    </div>
                `;
            }
        }

        function loadMoreEmails() {
            emailOffset += 50;
            loadEmails();
        }

        function updateInboxZeroProgress() {
            const countEl = document.getElementById('unread-count');
            countEl.textContent = totalUnread;
            countEl.className = 'inbox-zero-count' + (totalUnread === 0 ? ' zero' : '');

            // Calculate progress (assuming starting point of 100 for visual)
            const startOfDay = 100; // Could be tracked per day
            const progress = totalUnread === 0 ? 100 : Math.max(0, Math.min(100, ((startOfDay - totalUnread) / startOfDay) * 100));
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('inbox-zero-percent').textContent = `${Math.round(progress)}%`;

            document.getElementById('processed-today').textContent = processedToday;
        }

        function updateFilterCounts() {
            const respondCount = currentEmails.filter(e => taggedEmails[e.id]?.respond).length;
            const importantCount = currentEmails.filter(e => taggedEmails[e.id]?.important).length;

            document.getElementById('filter-all-count').textContent = currentEmails.length;
            document.getElementById('filter-respond-count').textContent = respondCount;
            document.getElementById('filter-important-count').textContent = importantCount;
            document.getElementById('filter-saved-count').textContent = savedEmails.length;

            document.getElementById('respond-count').textContent = respondCount;
            document.getElementById('important-count').textContent = importantCount;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');
            renderEmails();
        }

        function renderEmails() {
            const container = document.getElementById('email-list');
            let emails = currentEmails;

            // Apply filter
            if (currentFilter === 'respond') {
                emails = emails.filter(e => taggedEmails[e.id]?.respond);
            } else if (currentFilter === 'important') {
                emails = emails.filter(e => taggedEmails[e.id]?.important);
            } else if (currentFilter === 'saved') {
                emails = currentEmails.filter(e => savedEmails.some(s => s.id === e.id));
            }

            if (!emails.length) {
                const messages = {
                    all: totalUnread === 0
                        ? '<h3>🎉 Inbox Zero!</h3><p>Amazing work! You\'ve processed all your emails.</p>'
                        : '<p>No emails found.</p>',
                    respond: '<h3>All caught up!</h3><p>No emails tagged for response today.</p>',
                    important: '<h3>No important emails</h3><p>Tag emails with ⭐ to see them here.</p>',
                    saved: '<h3>No saved emails</h3><p>Save important emails to export them later.</p>'
                };
                container.innerHTML = `<div class="empty-state">${messages[currentFilter]}</div>`;
                return;
            }

            container.innerHTML = emails.map(email => {
                const tags = taggedEmails[email.id] || {};
                const isSaved = savedEmails.some(s => s.id === email.id);
                const tagClasses = [];
                if (tags.respond) tagClasses.push('tagged-respond');
                if (tags.important) tagClasses.push('tagged-important');

                return `
                    <div class="email-item ${tagClasses.join(' ')}" data-id="${email.id}">
                        <div class="email-checkbox" onclick="markAsRead(event, ${email.id})"></div>
                        <div class="email-content" onclick="openEmail(${email.id})">
                            <div class="email-header">
                                <span class="email-sender">${escapeHtml(email.senderName || email.sender)}</span>
                                <span class="email-time">${formatTime(email.received)}</span>
                            </div>
                            <div class="email-subject">${escapeHtml(email.subject || 'No subject')}</div>
                            <div class="email-tags">
                                ${tags.respond ? '<span class="email-tag respond">Respond Today</span>' : ''}
                                ${tags.important ? '<span class="email-tag important">Important</span>' : ''}
                                ${isSaved ? '<span class="email-tag saved">Saved</span>' : ''}
                            </div>
                        </div>
                        <div class="email-actions">
                            <button class="action-btn archive" onclick="archiveEmail(event, ${email.id})" title="Archive">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/>
                                </svg>
                            </button>
                            <button class="action-btn delete" onclick="deleteEmail(event, ${email.id})" title="Delete">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </button>
                            <div class="tag-dropdown">
                                <button class="action-btn tag" title="Tag">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
                                    </svg>
                                </button>
                                <div class="tag-dropdown-content">
                                    <button class="tag-option" onclick="toggleTag(event, ${email.id}, 'respond')">
                                        🔔 ${tags.respond ? 'Remove' : 'Add'} Respond Today
                                    </button>
                                    <button class="tag-option" onclick="toggleTag(event, ${email.id}, 'important')">
                                        ⭐ ${tags.important ? 'Remove' : 'Add'} Important
                                    </button>
                                </div>
                            </div>
                            <button class="action-btn save" onclick="toggleSave(event, ${email.id}, '${escapeHtml(email.subject)}', '${escapeHtml(email.sender)}')" title="${isSaved ? 'Unsave' : 'Save'}">
                                <svg viewBox="0 0 24 24" fill="${isSaved ? 'var(--accent-info)' : 'none'}" stroke="currentColor" stroke-width="2">
                                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Email Actions
        async function archiveEmail(event, id) {
            event.stopPropagation();
            try {
                await fetch(`${API_BASE}/emails/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emailId: id, action: 'archive' })
                });
                removeEmailFromList(id);
                incrementProcessed();
                showToast('Email archived');
            } catch (e) {
                console.error('Archive failed:', e);
            }
        }

        async function deleteEmail(event, id) {
            event.stopPropagation();
            try {
                await fetch(`${API_BASE}/emails/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emailId: id, action: 'delete' })
                });
                removeEmailFromList(id);
                incrementProcessed();
                showToast('Email deleted');
            } catch (e) {
                console.error('Delete failed:', e);
            }
        }

        async function markAsRead(event, id) {
            event.stopPropagation();
            const checkbox = event.target;
            checkbox.classList.toggle('checked');

            if (checkbox.classList.contains('checked')) {
                try {
                    await fetch(`${API_BASE}/emails/action`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ emailId: id, action: 'archive' })
                    });
                    setTimeout(() => {
                        removeEmailFromList(id);
                        incrementProcessed();
                    }, 300);
                } catch (e) {
                    checkbox.classList.remove('checked');
                }
            }
        }

        function removeEmailFromList(id) {
            currentEmails = currentEmails.filter(e => e.id !== id);
            totalUnread = Math.max(0, totalUnread - 1);
            updateInboxZeroProgress();
            updateFilterCounts();
            renderEmails();
        }

        function incrementProcessed() {
            processedToday++;
            localStorage.setItem('felixProcessedToday', processedToday.toString());
            document.getElementById('processed-today').textContent = processedToday;
        }

        // Tagging
        function toggleTag(event, id, tag) {
            event.stopPropagation();
            if (!taggedEmails[id]) taggedEmails[id] = {};
            taggedEmails[id][tag] = !taggedEmails[id][tag];
            localStorage.setItem('felixTags', JSON.stringify(taggedEmails));
            updateFilterCounts();
            renderEmails();
            showToast(taggedEmails[id][tag] ? `Tagged as ${tag}` : `Removed ${tag} tag`);
        }

        // Saving
        function toggleSave(event, id, subject, sender) {
            event.stopPropagation();
            const idx = savedEmails.findIndex(s => s.id === id);
            if (idx >= 0) {
                savedEmails.splice(idx, 1);
                showToast('Email unsaved');
            } else {
                savedEmails.push({ id, subject, sender, savedAt: new Date().toISOString() });
                showToast('Email saved');
            }
            localStorage.setItem('felixSaved', JSON.stringify(savedEmails));
            updateFilterCounts();
            renderEmails();
            renderSavedEmails();
        }

        function renderSavedEmails() {
            const panel = document.getElementById('saved-panel');
            const list = document.getElementById('saved-emails-list');

            if (savedEmails.length === 0) {
                panel.style.display = 'none';
                return;
            }

            panel.style.display = 'block';
            list.innerHTML = savedEmails.map(email => `
                <div class="saved-email-item">
                    <span>${escapeHtml(email.subject || 'No subject')}</span>
                    <button class="remove-saved" onclick="removeSaved(${email.id})">✕</button>
                </div>
            `).join('');
        }

        function removeSaved(id) {
            savedEmails = savedEmails.filter(s => s.id !== id);
            localStorage.setItem('felixSaved', JSON.stringify(savedEmails));
            updateFilterCounts();
            renderEmails();
            renderSavedEmails();
        }

        function exportSavedEmails() {
            if (savedEmails.length === 0) {
                showToast('No saved emails to export');
                return;
            }

            let content = `Felix - Saved Emails Export\n`;
            content += `Exported: ${new Date().toLocaleString()}\n`;
            content += `${'='.repeat(50)}\n\n`;

            savedEmails.forEach((email, i) => {
                content += `${i + 1}. ${email.subject || 'No subject'}\n`;
                content += `   From: ${email.sender}\n`;
                content += `   Saved: ${new Date(email.savedAt).toLocaleString()}\n\n`;
            });

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `felix-saved-emails-${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Emails exported to file');
        }

        // Chat
        function addFelixMessage(text) {
            const container = document.getElementById('chat-messages');
            container.innerHTML += `
                <div class="chat-message felix">
                    <div class="chat-avatar">F</div>
                    <div class="chat-bubble">${text}</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function addUserMessage(text) {
            const container = document.getElementById('chat-messages');
            container.innerHTML += `
                <div class="chat-message user">
                    <div class="chat-bubble">${escapeHtml(text)}</div>
                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendChat();
            }
        }

        function sendQuickCmd(cmd) {
            document.getElementById('chat-input').value = cmd;
            sendChat();
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            addUserMessage(message);
            input.value = '';

            // Process command
            const lowerMsg = message.toLowerCase();

            try {
                const res = await fetch(`${API_BASE}/felix/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: message })
                });

                const data = await res.json();

                if (data.success) {
                    addFelixMessage(data.response);
                    if (data.ruleCreated) {
                        showToast('Rule created!');
                    }
                    if (data.actionsPerformed) {
                        emailOffset = 0;
                        loadEmails();
                    }
                } else {
                    addFelixMessage(data.response || "I couldn't understand that. Try something like 'delete all newsletters' or 'auto-archive emails from LinkedIn'.");
                }
            } catch (e) {
                console.error('Chat error:', e);
                addFelixMessage("Sorry, I couldn't process that. Make sure the server is running.");
            }
        }

        function openEmail(id) {
            // Could open a preview modal, for now just mark read
            showToast('Opening in Mail app...');
        }

        // Utilities
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);

            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
