<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b8935a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Felix — Your Chief of Staff</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f9fc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f2f5;
            --bg-elevated: #e8eaef;
            --text-primary: #1a1d23;
            --text-secondary: #5a5d63;
            --text-muted: #8a8d93;
            --accent-warm: #b8935a;
            --accent-warm-dim: rgba(184, 147, 90, 0.12);
            --accent-success: #4a9a4a;
            --accent-warning: #c4922a;
            --accent-danger: #c45a5a;
            --accent-info: #4a7a9a;
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-neumorphic: 6px 6px 14px rgba(0, 0, 0, 0.08), -4px -4px 10px rgba(255, 255, 255, 0.9);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-columns: 420px 1fr;
            height: 100vh;
        }

        /* Chat Panel */
        .chat-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--bg-elevated);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--bg-tertiary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-warm), #a88a5c);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            color: white;
        }

        .chat-title h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 500;
        }

        .chat-title p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .unread-badge {
            margin-left: auto;
            background: var(--accent-warm);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .unread-badge.zero {
            background: var(--accent-success);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 95%;
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .msg.felix {
            background: var(--bg-tertiary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.user {
            background: var(--accent-warm);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.system {
            background: rgba(74, 154, 74, 0.1);
            color: var(--accent-success);
            align-self: center;
            font-size: 12px;
            padding: 8px 16px;
        }

        .msg.error {
            background: rgba(196, 90, 90, 0.1);
            color: var(--accent-danger);
        }

        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--bg-tertiary);
            background: var(--bg-tertiary);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: var(--radius-lg);
            background: var(--bg-secondary);
            font-size: 14px;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.05);
        }

        .chat-input:focus {
            outline: none;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.05), 0 0 0 2px var(--accent-warm-dim);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--accent-warm);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            filter: brightness(1.1);
        }

        .suggestions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .suggest-btn {
            padding: 5px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--bg-elevated);
            border-radius: var(--radius-sm);
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .suggest-btn:hover {
            background: var(--accent-warm-dim);
            border-color: var(--accent-warm);
            color: var(--accent-warm);
        }

        /* Email Panel */
        .email-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .email-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--bg-elevated);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
        }

        .email-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 500;
        }

        .filter-btns {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        .filter-btn {
            padding: 6px 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--accent-warm);
            color: white;
        }

        .email-list {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-secondary);
        }

        .email-row {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid var(--bg-tertiary);
            cursor: pointer;
            gap: 10px;
            font-size: 12px;
        }

        .email-row:hover {
            background: var(--bg-tertiary);
        }

        .email-row.selected {
            background: var(--accent-warm-dim);
        }

        .email-check {
            width: 16px;
            height: 16px;
            border: 2px solid var(--bg-elevated);
            border-radius: 3px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .email-check.checked {
            background: var(--accent-warm);
            border-color: var(--accent-warm);
        }

        .email-sender {
            width: 160px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .email-subject {
            flex: 1;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .email-tag {
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .email-tag.respond { background: rgba(196, 146, 42, 0.2); color: var(--accent-warning); }
        .email-tag.important { background: rgba(196, 90, 90, 0.2); color: var(--accent-danger); }
        .email-tag.later { background: rgba(74, 122, 154, 0.2); color: var(--accent-info); }

        .email-time {
            width: 60px;
            color: var(--text-muted);
            font-size: 11px;
            text-align: right;
            flex-shrink: 0;
        }

        .bulk-bar {
            display: none;
            padding: 10px 16px;
            background: var(--accent-warm);
            color: white;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }

        .bulk-bar.show { display: flex; }

        .bulk-btn {
            padding: 5px 12px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 11px;
            cursor: pointer;
        }

        .bulk-btn:hover { background: rgba(255,255,255,0.3); }

        .empty-state {
            padding: 60px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state h3 {
            color: var(--accent-success);
            margin-bottom: 8px;
        }

        .load-more {
            padding: 12px;
            text-align: center;
        }

        .load-more button {
            padding: 8px 20px;
            border: 1px dashed var(--bg-elevated);
            border-radius: var(--radius-sm);
            background: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
        }

        .load-more button:hover {
            border-color: var(--accent-warm);
            color: var(--accent-warm);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: var(--text-primary);
            color: white;
            border-radius: var(--radius-md);
            font-size: 13px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show { transform: translateY(0); opacity: 1; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Chat -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="logo">F</div>
                <div class="chat-title">
                    <h1>Felix</h1>
                    <p>Your Chief of Staff</p>
                </div>
                <div class="unread-badge" id="unread-badge">--</div>
            </div>
            <div class="chat-messages" id="chat"></div>
            <div class="chat-input-area">
                <div class="input-row">
                    <input type="text" class="chat-input" id="input" placeholder="Tell me what to do..." autofocus>
                    <button class="send-btn" onclick="send()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <div class="suggestions">
                    <button class="suggest-btn" onclick="say('delete all newsletters')">Delete newsletters</button>
                    <button class="suggest-btn" onclick="say('archive all from linkedin')">Archive LinkedIn</button>
                    <button class="suggest-btn" onclick="say('show me emails from vercel')">From Vercel</button>
                    <button class="suggest-btn" onclick="say('tag selected as respond')">Tag respond</button>
                    <button class="suggest-btn" onclick="say('select all')">Select all</button>
                    <button class="suggest-btn" onclick="say('help')">Help</button>
                </div>
            </div>
        </div>

        <!-- Emails -->
        <div class="email-panel">
            <div class="bulk-bar" id="bulk-bar">
                <span><b id="sel-count">0</b> selected</span>
                <button class="bulk-btn" onclick="say('delete selected')">Delete</button>
                <button class="bulk-btn" onclick="say('archive selected')">Archive</button>
                <button class="bulk-btn" onclick="say('tag selected as respond')">Tag: Respond</button>
                <button class="bulk-btn" onclick="say('tag selected as important')">Tag: Important</button>
                <button class="bulk-btn" onclick="say('save selected')">Save</button>
                <button class="bulk-btn" onclick="clearSel()">Cancel</button>
            </div>
            <div class="email-header">
                <h2>Inbox</h2>
                <div class="filter-btns">
                    <button class="filter-btn active" onclick="setFilter('all')">All</button>
                    <button class="filter-btn" onclick="setFilter('respond')">Respond</button>
                    <button class="filter-btn" onclick="setFilter('important')">Important</button>
                    <button class="filter-btn" onclick="setFilter('later')">Later</button>
                </div>
            </div>
            <div class="email-list" id="emails"></div>
            <div class="load-more" id="load-more" style="display:none;">
                <button onclick="loadMore()">Load more</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const API = 'http://localhost:3847/api';
        let emails = [];
        let selected = new Set();
        let tags = JSON.parse(localStorage.getItem('tags') || '{}');
        let filter = 'all';
        let offset = 0;
        let total = 0;

        // Init
        document.getElementById('input').addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === '/') { e.preventDefault(); document.getElementById('input').focus(); }
            if (e.key === 'a' && e.metaKey) { e.preventDefault(); say('select all'); }
        });

        load();
        addMsg('felix', `Good ${getGreeting()}! I'm Felix, your email assistant. Tell me what to do with your inbox.

Try things like:
• "delete all from linkedin"
• "archive newsletters"
• "show emails from amazon"
• "tag #3 as important"
• "select 1-10 then delete"
• "auto-delete future emails from sender.com"

Type "help" for all commands.`);

        function getGreeting() {
            const h = new Date().getHours();
            return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
        }

        // Data
        async function load() {
            try {
                const r = await fetch(`${API}/emails/unread?limit=100&offset=${offset}`);
                const d = await r.json();
                if (d.success) {
                    emails = offset === 0 ? d.emails : [...emails, ...d.emails];
                    total = d.total;
                    render();
                    updateBadge();
                    document.getElementById('load-more').style.display = emails.length < total ? 'block' : 'none';
                }
            } catch (e) {
                addMsg('error', 'Could not connect to server. Is Felix running?');
            }
        }

        function loadMore() { offset += 100; load(); }

        function updateBadge() {
            const b = document.getElementById('unread-badge');
            b.textContent = total;
            b.classList.toggle('zero', total === 0);
        }

        function render() {
            const el = document.getElementById('emails');
            let list = emails;
            if (filter !== 'all') list = list.filter(e => tags[e.id] === filter);

            if (list.length === 0) {
                el.innerHTML = `<div class="empty-state"><h3>${filter === 'all' ? 'Inbox Zero!' : 'No emails'}</h3><p>${filter === 'all' ? 'You did it!' : 'No emails with this tag'}</p></div>`;
                return;
            }

            el.innerHTML = list.map((e, i) => {
                const tag = tags[e.id];
                const sel = selected.has(e.id);
                const num = emails.indexOf(e) + 1;
                return `<div class="email-row ${sel ? 'selected' : ''}" data-id="${e.id}">
                    <div class="email-check ${sel ? 'checked' : ''}" onclick="toggle(event,${e.id})"></div>
                    <span class="email-sender" title="${esc(e.sender)}">#${num} ${esc(e.senderName || e.sender?.split('@')[0] || '?')}</span>
                    <span class="email-subject" title="${esc(e.subject)}">${esc(e.subject || '(no subject)')}</span>
                    ${tag ? `<span class="email-tag ${tag}">${tag}</span>` : ''}
                    <span class="email-time">${timeAgo(e.received)}</span>
                </div>`;
            }).join('');

            updateBulk();
        }

        function toggle(ev, id) {
            ev.stopPropagation();
            selected.has(id) ? selected.delete(id) : selected.add(id);
            render();
        }

        function clearSel() { selected.clear(); render(); }

        function updateBulk() {
            const bar = document.getElementById('bulk-bar');
            document.getElementById('sel-count').textContent = selected.size;
            bar.classList.toggle('show', selected.size > 0);
        }

        function setFilter(f) {
            filter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filter-btn:nth-child(${f === 'all' ? 1 : f === 'respond' ? 2 : f === 'important' ? 3 : 4})`).classList.add('active');
            render();
        }

        function timeAgo(d) {
            if (!d) return '';
            const diff = (Date.now() - new Date(d)) / 60000;
            if (diff < 60) return Math.floor(diff) + 'm';
            if (diff < 1440) return Math.floor(diff / 60) + 'h';
            return new Date(d).toLocaleDateString('en', { month: 'short', day: 'numeric' });
        }

        function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        // Chat
        function addMsg(type, text) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function say(text) {
            document.getElementById('input').value = text;
            send();
        }

        async function send() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMsg('user', text);
            const response = await process(text);
            addMsg('felix', response);
        }

        // Command Processing
        async function process(cmd) {
            const c = cmd.toLowerCase().trim();

            // HELP
            if (c === 'help' || c === '?') {
                return `FELIX COMMANDS:

VIEWING:
• "show all" / "refresh" - reload emails
• "show from [sender]" - filter by sender
• "show tagged [respond/important/later]"

SELECTION:
• "select all" - select all visible emails
• "select 1-10" - select range by number
• "select from [sender]" - select by sender
• "clear selection" - deselect all

ACTIONS (on selected or specify):
• "delete selected" / "delete all from [sender]"
• "archive selected" / "archive all from [sender]"
• "tag selected as [respond/important/later]"
• "save selected" - save to file
• "clear tags" - remove all tags from selected

RULES:
• "auto-delete from [sender]" - future emails
• "auto-archive from [sender]" - future emails
• "unsubscribe from [sender]" - mark as unsubscribe

SHORTCUTS:
• "delete newsletters" - delete marketing emails
• "archive promos" - archive promotional
• "inbox status" - show summary

Type naturally! I'll figure out what you mean.`;
            }

            // STATUS
            if (c.includes('status') || c.includes('how many') || c === 'inbox') {
                const respond = emails.filter(e => tags[e.id] === 'respond').length;
                const important = emails.filter(e => tags[e.id] === 'important').length;
                return `📊 Inbox Status:
• ${total} total unread emails
• ${respond} tagged "respond"
• ${important} tagged "important"
• ${selected.size} currently selected

${total === 0 ? '🎉 Inbox zero achieved!' : total < 10 ? '👍 Almost there!' : 'Let\'s clean this up!'}`;
            }

            // REFRESH
            if (c === 'refresh' || c === 'reload' || c === 'show all') {
                offset = 0; filter = 'all';
                await load();
                setFilter('all');
                return `Refreshed! ${total} unread emails.`;
            }

            // SELECT ALL
            if (c === 'select all') {
                const visible = filter === 'all' ? emails : emails.filter(e => tags[e.id] === filter);
                visible.forEach(e => selected.add(e.id));
                render();
                return `Selected ${selected.size} emails. Now tell me what to do with them.`;
            }

            // SELECT RANGE (select 1-10)
            const rangeMatch = c.match(/select\s+(\d+)\s*[-–to]+\s*(\d+)/);
            if (rangeMatch) {
                const start = parseInt(rangeMatch[1]) - 1;
                const end = parseInt(rangeMatch[2]);
                selected.clear();
                for (let i = start; i < end && i < emails.length; i++) {
                    selected.add(emails[i].id);
                }
                render();
                return `Selected emails #${start + 1} to #${Math.min(end, emails.length)}.`;
            }

            // SELECT BY NUMBER (select #5 or select 5)
            const numMatch = c.match(/select\s+#?(\d+)/);
            if (numMatch && !c.includes('-')) {
                const idx = parseInt(numMatch[1]) - 1;
                if (idx >= 0 && idx < emails.length) {
                    selected.add(emails[idx].id);
                    render();
                    return `Selected email #${idx + 1}: "${emails[idx].subject}"`;
                }
                return `No email #${numMatch[1]} found.`;
            }

            // CLEAR SELECTION
            if (c.includes('clear') && c.includes('select')) {
                selected.clear();
                render();
                return 'Selection cleared.';
            }

            // SELECT FROM SENDER
            if (c.startsWith('select') && c.includes('from')) {
                const sender = extractSender(c);
                if (sender) {
                    const matches = emails.filter(e => matchSender(e, sender));
                    matches.forEach(e => selected.add(e.id));
                    render();
                    return `Selected ${matches.length} emails from "${sender}".`;
                }
            }

            // SHOW FROM SENDER
            if ((c.startsWith('show') || c.startsWith('find') || c.startsWith('search')) && c.includes('from')) {
                const sender = extractSender(c);
                if (sender) {
                    const matches = emails.filter(e => matchSender(e, sender));
                    if (matches.length === 0) return `No emails from "${sender}" found.`;
                    selected.clear();
                    matches.forEach(e => selected.add(e.id));
                    render();
                    return `Found ${matches.length} emails from "${sender}". They're now selected.`;
                }
            }

            // SHOW TAGGED
            if (c.includes('show') && (c.includes('tagged') || c.includes('respond') || c.includes('important') || c.includes('later'))) {
                const tag = c.includes('respond') ? 'respond' : c.includes('important') ? 'important' : 'later';
                setFilter(tag);
                return `Showing emails tagged "${tag}".`;
            }

            // DELETE SELECTED
            if (c.includes('delete') && (c.includes('selected') || c.includes('them'))) {
                if (selected.size === 0) return 'No emails selected. Select some first, or say "delete all from [sender]".';
                const count = selected.size;
                await bulkAction('delete');
                return `🗑️ Deleted ${count} emails.`;
            }

            // ARCHIVE SELECTED
            if (c.includes('archive') && (c.includes('selected') || c.includes('them'))) {
                if (selected.size === 0) return 'No emails selected. Select some first.';
                const count = selected.size;
                await bulkAction('archive');
                return `📦 Archived ${count} emails.`;
            }

            // TAG SELECTED
            if (c.includes('tag') && (c.includes('selected') || c.includes('them'))) {
                const tag = c.includes('respond') ? 'respond' : c.includes('important') ? 'important' : c.includes('later') ? 'later' : null;
                if (!tag) return 'Tag as what? Try "tag selected as respond" or "important" or "later".';
                if (selected.size === 0) return 'No emails selected.';
                selected.forEach(id => tags[id] = tag);
                saveTags();
                const count = selected.size;
                selected.clear();
                render();
                return `🏷️ Tagged ${count} emails as "${tag}".`;
            }

            // TAG BY NUMBER
            const tagNumMatch = c.match(/tag\s+#?(\d+)\s+(?:as\s+)?(\w+)/);
            if (tagNumMatch) {
                const idx = parseInt(tagNumMatch[1]) - 1;
                const tag = tagNumMatch[2].toLowerCase();
                if (idx >= 0 && idx < emails.length && ['respond', 'important', 'later'].includes(tag)) {
                    tags[emails[idx].id] = tag;
                    saveTags();
                    render();
                    return `Tagged email #${idx + 1} as "${tag}".`;
                }
            }

            // CLEAR TAGS
            if (c.includes('clear') && c.includes('tag')) {
                if (selected.size === 0) return 'No emails selected.';
                selected.forEach(id => delete tags[id]);
                saveTags();
                const count = selected.size;
                selected.clear();
                render();
                return `Cleared tags from ${count} emails.`;
            }

            // SAVE SELECTED
            if (c.includes('save') && (c.includes('selected') || c.includes('them'))) {
                if (selected.size === 0) return 'No emails selected.';
                let saved = 0;
                for (const id of selected) {
                    const e = emails.find(x => x.id === id);
                    if (e) {
                        try {
                            await fetch(`${API}/emails/save`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ emailId: id, sender: e.sender, subject: e.subject })
                            });
                            saved++;
                        } catch (err) {}
                    }
                }
                selected.clear();
                render();
                return `💾 Saved ${saved} emails to ~/Documents/Felix/saved-emails/`;
            }

            // DELETE FROM SENDER
            if (c.includes('delete') && (c.includes('from') || c.includes('all'))) {
                const sender = extractSender(c);
                if (sender) {
                    const matches = emails.filter(e => matchSender(e, sender));
                    if (matches.length === 0) return `No emails from "${sender}" found.`;
                    for (const e of matches) await action(e.id, 'delete');
                    emails = emails.filter(e => !matches.find(m => m.id === e.id));
                    total -= matches.length;
                    render();
                    updateBadge();
                    return `🗑️ Deleted ${matches.length} emails from "${sender}". Want me to auto-delete future ones? Say "auto-delete from ${sender}"`;
                }
            }

            // ARCHIVE FROM SENDER
            if (c.includes('archive') && (c.includes('from') || c.includes('all'))) {
                const sender = extractSender(c);
                if (sender) {
                    const matches = emails.filter(e => matchSender(e, sender));
                    if (matches.length === 0) return `No emails from "${sender}" found.`;
                    for (const e of matches) await action(e.id, 'archive');
                    emails = emails.filter(e => !matches.find(m => m.id === e.id));
                    total -= matches.length;
                    render();
                    updateBadge();
                    return `📦 Archived ${matches.length} emails from "${sender}".`;
                }
            }

            // DELETE NEWSLETTERS
            if (c.includes('delete') && (c.includes('newsletter') || c.includes('marketing') || c.includes('promo'))) {
                const matches = emails.filter(e => isNewsletter(e));
                if (matches.length === 0) return 'No obvious newsletters found.';
                for (const e of matches) await action(e.id, 'delete');
                emails = emails.filter(e => !matches.find(m => m.id === e.id));
                total -= matches.length;
                render();
                updateBadge();
                return `🗑️ Deleted ${matches.length} newsletter/marketing emails. ${total} remaining.`;
            }

            // ARCHIVE PROMOS
            if (c.includes('archive') && (c.includes('promo') || c.includes('marketing'))) {
                const matches = emails.filter(e => isPromo(e));
                for (const e of matches) await action(e.id, 'archive');
                emails = emails.filter(e => !matches.find(m => m.id === e.id));
                total -= matches.length;
                render();
                updateBadge();
                return `📦 Archived ${matches.length} promotional emails.`;
            }

            // AUTO-DELETE RULE
            if (c.includes('auto-delete') || (c.includes('always') && c.includes('delete'))) {
                const sender = extractSender(c);
                if (sender) {
                    await createRule('auto-delete', sender);
                    return `✅ Rule created: Auto-delete future emails from "${sender}".`;
                }
                return 'From which sender? Try "auto-delete from example.com"';
            }

            // AUTO-ARCHIVE RULE
            if (c.includes('auto-archive') || (c.includes('always') && c.includes('archive'))) {
                const sender = extractSender(c);
                if (sender) {
                    await createRule('auto-archive', sender);
                    return `✅ Rule created: Auto-archive future emails from "${sender}".`;
                }
                return 'From which sender? Try "auto-archive from linkedin"';
            }

            // UNSUBSCRIBE
            if (c.includes('unsubscribe')) {
                const sender = extractSender(c);
                if (sender) {
                    await createRule('unsubscribe', sender);
                    return `✅ Marked as unsubscribe: "${sender}". Future emails will be auto-deleted.`;
                }
                return 'From which sender? Try "unsubscribe from newsletter.com"';
            }

            // DELETE BY NUMBER
            const delNumMatch = c.match(/delete\s+#?(\d+)/);
            if (delNumMatch) {
                const idx = parseInt(delNumMatch[1]) - 1;
                if (idx >= 0 && idx < emails.length) {
                    const e = emails[idx];
                    await action(e.id, 'delete');
                    emails.splice(idx, 1);
                    total--;
                    render();
                    updateBadge();
                    return `🗑️ Deleted email #${idx + 1}: "${e.subject}"`;
                }
            }

            // ARCHIVE BY NUMBER
            const archNumMatch = c.match(/archive\s+#?(\d+)/);
            if (archNumMatch) {
                const idx = parseInt(archNumMatch[1]) - 1;
                if (idx >= 0 && idx < emails.length) {
                    const e = emails[idx];
                    await action(e.id, 'archive');
                    emails.splice(idx, 1);
                    total--;
                    render();
                    updateBadge();
                    return `📦 Archived email #${idx + 1}: "${e.subject}"`;
                }
            }

            // Fallback
            return `I didn't understand that. Try:
• "delete all from [sender]"
• "archive newsletters"
• "select 1-5 then delete them"
• "tag #3 as important"
• "help" for all commands`;
        }

        // Helpers
        function extractSender(cmd) {
            const match = cmd.match(/(?:from|@)\s*([^\s,]+)/i);
            return match ? match[1].replace(/['"]/g, '') : null;
        }

        function matchSender(email, query) {
            const s = (email.sender || '').toLowerCase();
            const n = (email.senderName || '').toLowerCase();
            const q = query.toLowerCase();
            return s.includes(q) || n.includes(q);
        }

        function isNewsletter(e) {
            const s = (e.sender || '').toLowerCase();
            const subj = (e.subject || '').toLowerCase();
            return s.includes('newsletter') || s.includes('noreply') || s.includes('marketing') ||
                   s.includes('info@') || s.includes('hello@') || s.includes('news@') ||
                   subj.includes('unsubscribe') || subj.includes('weekly') || subj.includes('digest');
        }

        function isPromo(e) {
            const s = (e.sender || '').toLowerCase();
            const subj = (e.subject || '').toLowerCase();
            return s.includes('promo') || s.includes('deals') || s.includes('offer') ||
                   subj.includes('% off') || subj.includes('sale') || subj.includes('discount');
        }

        async function action(id, act) {
            const e = emails.find(x => x.id === id);
            try {
                await fetch(`${API}/emails/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emailId: id, sender: e?.sender, subject: e?.subject, action: act })
                });
            } catch (err) {}
        }

        async function bulkAction(act) {
            const ids = Array.from(selected);
            for (const id of ids) await action(id, act);
            emails = emails.filter(e => !selected.has(e.id));
            total -= ids.length;
            selected.clear();
            render();
            updateBadge();
        }

        async function createRule(type, sender) {
            try {
                await fetch(`${API}/rules/quick/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender })
                });
            } catch (err) {}
        }

        function saveTags() { localStorage.setItem('tags', JSON.stringify(tags)); }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
