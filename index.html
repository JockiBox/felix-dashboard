<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felix — Your Chief of Staff</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f9fc;
            --card: #ffffff;
            --border: #e8eaef;
            --text: #1a1d23;
            --muted: #6b7280;
            --accent: #b8935a;
            --accent-dim: rgba(184, 147, 90, 0.12);
            --success: #22c55e;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        .app { display: grid; grid-template-columns: 400px 1fr; grid-template-rows: 56px 1fr; height: 100vh; gap: 1px; background: var(--border); }

        header { grid-column: 1 / -1; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), #8b6914); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 16px; color: white; }
        .logo h1 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; }
        .stats { display: flex; gap: 20px; }
        .stat-val { font-size: 18px; font-weight: 600; color: var(--accent); }
        .stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }

        .chat-panel { background: var(--card); display: flex; flex-direction: column; }
        .chat-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .avatar { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), #8b6914); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 12px; color: white; }
        .messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 90%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4; }
        .msg.felix { background: #f3f4f6; align-self: flex-start; }
        .msg.user { background: var(--accent); color: white; align-self: flex-end; }
        .msg-actions { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
        .msg-action { padding: 4px 8px; background: white; border: 1px solid var(--border); border-radius: 5px; font-size: 10px; cursor: pointer; }
        .msg-action:hover { background: var(--accent-dim); border-color: var(--accent); }
        .chat-input { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
        .chat-input input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
        .chat-input input:focus { outline: none; border-color: var(--accent); }
        .chat-input button { width: 36px; height: 36px; border: none; border-radius: 50%; background: var(--accent); color: white; cursor: pointer; }

        .email-panel { background: var(--card); display: flex; flex-direction: column; }
        .toolbar { padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .toolbar h2 { font-family: 'Cormorant Garamond', serif; font-size: 16px; }
        .toolbar .sel { font-size: 11px; color: var(--muted); margin-left: auto; }
        .filters { display: flex; gap: 3px; }
        .filters button { padding: 4px 10px; border: none; border-radius: 4px; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; }
        .filters button.on { background: var(--accent); color: white; }
        .email-list { flex: 1; overflow-y: auto; }
        .email-row { display: grid; grid-template-columns: 18px 130px 1fr 50px; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--border); font-size: 12px; cursor: pointer; }
        .email-row:hover { background: #fafafa; }
        .email-row.sel { background: var(--accent-dim); }
        .chk { width: 14px; height: 14px; border: 2px solid var(--border); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; }
        .chk.on { background: var(--accent); border-color: var(--accent); color: white; }
        .sender { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .subj { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .time { color: var(--muted); text-align: right; font-size: 10px; }
        .empty { padding: 30px; text-align: center; color: var(--muted); }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="logo"><div class="logo-icon">F</div><h1>Felix</h1></div>
            <div class="stats">
                <div class="stat"><div class="stat-val" id="unread">--</div><div class="stat-lbl">Unread</div></div>
                <div class="stat"><div class="stat-val" id="respond">0</div><div class="stat-lbl">Respond</div></div>
            </div>
        </header>
        <aside class="chat-panel">
            <div class="chat-header"><div class="avatar">F</div><span style="font-size:13px">Felix</span></div>
            <div class="messages" id="chat"></div>
            <div class="chat-input">
                <input type="text" id="inp" placeholder="Ask Felix anything...">
                <button id="sendBtn">➤</button>
            </div>
        </aside>
        <main class="email-panel">
            <div class="toolbar">
                <h2>Inbox</h2>
                <span class="sel" id="selInfo"></span>
                <div class="filters" id="filters">
                    <button class="on" data-f="all">All</button>
                    <button data-f="respond">Respond</button>
                    <button data-f="important">Important</button>
                </div>
            </div>
            <div class="email-list" id="list"></div>
        </main>
    </div>

<script>
const API = 'http://localhost:3847/api';
let emails = [], selected = new Set(), tags = JSON.parse(localStorage.getItem('felixTags')||'{}'), filter = 'all', total = 0, pending = null;

// Init
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('sendBtn');

inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
sendBtn.addEventListener('click', send);
document.querySelectorAll('#filters button').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.f)));

load();

async function load() {
    say("Loading your emails...");
    try {
        const r = await fetch(API + '/emails/unread?limit=100');
        const d = await r.json();
        if (d.success) {
            emails = d.emails;
            total = d.total;
            render();
            updateStats();
            document.getElementById('chat').innerHTML = '';
            analyze();
        }
    } catch(e) {
        document.getElementById('chat').innerHTML = '';
        say("Can't connect to email server. Is it running on port 3847?");
    }
}

function analyze() {
    if (!emails.length) { say("Inbox empty! 🎉"); return; }

    // Group by domain
    const domains = {};
    emails.forEach(e => {
        const d = (e.sender||'').split('@')[1] || 'unknown';
        domains[d] = (domains[d]||0) + 1;
    });

    const top = Object.entries(domains).filter(([d]) => d!=='unknown').sort((a,b) => b[1]-a[1]).slice(0,4);
    const newsletters = emails.filter(isNL).length;

    let msg = `📊 **${total} emails.** I can clean up:\n`;
    top.forEach(([d,c]) => { if(c >= 2) msg += `• **${c}** from ${d}\n`; });
    if (newsletters) msg += `• **${newsletters}** newsletters\n`;

    const actions = [];
    if (top[0] && top[0][1] >= 2) actions.push({label: `Delete ${top[0][0]}`, cmd: `delete ${top[0][0]}`});
    if (newsletters) actions.push({label: `Delete newsletters`, cmd: 'delete newsletters'});
    actions.push({label: 'Help', cmd: 'help'});

    sayActions(msg, actions);
}

function render() {
    const el = document.getElementById('list');
    let list = filter === 'all' ? emails : emails.filter(e => tags[e.id] === filter);
    if (!list.length) { el.innerHTML = '<div class="empty">No emails</div>'; return; }
    el.innerHTML = list.map(e => {
        const s = selected.has(e.id);
        const name = e.senderName || (e.sender||'').split('@')[0] || '?';
        return `<div class="email-row${s?' sel':''}" data-id="${e.id}">
            <div class="chk${s?' on':''}">${s?'✓':''}</div>
            <div class="sender">${esc(name)}</div>
            <div class="subj">${esc(e.subject||'(no subject)')}</div>
            <div class="time">${ago(e.received)}</div>
        </div>`;
    }).join('');
    el.querySelectorAll('.email-row').forEach(row => row.addEventListener('click', () => toggle(+row.dataset.id)));
    document.getElementById('selInfo').textContent = selected.size ? selected.size + ' selected' : '';
}

function toggle(id) { selected.has(id) ? selected.delete(id) : selected.add(id); render(); }
function updateStats() { document.getElementById('unread').textContent = total; document.getElementById('respond').textContent = Object.values(tags).filter(t=>t==='respond').length; }
function setFilter(f) { filter = f; document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('on', b.dataset.f === f)); render(); }
function ago(d) { if(!d) return ''; const m = (Date.now() - new Date(d))/60000; return m < 60 ? Math.floor(m)+'m' : m < 1440 ? Math.floor(m/60)+'h' : new Date(d).toLocaleDateString('en',{month:'short',day:'numeric'}); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function say(text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg felix';
    div.innerHTML = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function sayActions(text, actions) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg felix';
    div.innerHTML = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    if (actions && actions.length) {
        const wrap = document.createElement('div');
        wrap.className = 'msg-actions';
        actions.forEach(a => {
            const btn = document.createElement('button');
            btn.className = 'msg-action';
            btn.textContent = a.label;
            btn.addEventListener('click', () => { inp.value = a.cmd; send(); });
            wrap.appendChild(btn);
        });
        div.appendChild(wrap);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function sayUser(text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg user';
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function send() {
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    sayUser(text);

    try {
        const result = await process(text);
        if (result.actions) sayActions(result.text, result.actions);
        else say(result.text || result);
    } catch(e) {
        console.error(e);
        say("Something went wrong. Try again.");
    }
    inp.focus();
}

// Smart intent detection
async function process(input) {
    const t = input.toLowerCase().trim();

    // Pending confirmation
    if (pending) {
        if (/^(y|yes|yeah|yep|sure|ok|okay|do it|go)/.test(t)) {
            const p = pending; pending = null;
            return await doDelete(p.list, p.name);
        }
        if (/^(n|no|nope|cancel|stop)/.test(t)) {
            pending = null;
            return "Cancelled.";
        }
    }

    // GREETINGS
    if (/^(hi|hello|hey|yo|sup|morning|afternoon|evening)/.test(t)) {
        return {text: `Hey! **${total}** unread emails. What do you need?`, actions: [{label:'Suggestions', cmd:'suggest'}, {label:'Help', cmd:'help'}]};
    }

    // HELP
    if (/help|what can you|how do i|\?$/.test(t)) {
        return `**I can help you:**\n• "delete vercel" - delete emails from vercel\n• "delete newsletters" - clean up newsletters\n• "archive amazon" - archive Amazon emails\n• "select all" then "delete them"\n• Just type a sender name to find emails\n\nOr click the suggestion buttons!`;
    }

    // STATUS
    if (/status|how many|inbox|count|overview/.test(t)) {
        return `📬 **${total}** unread emails, **${selected.size}** selected.`;
    }

    // SUGGEST / ANALYZE
    if (/suggest|analyze|clean|what should/.test(t)) {
        analyze();
        return {text: "Here are my suggestions ⬆️", actions: []};
    }

    // REFRESH
    if (/refresh|reload|check|sync/.test(t)) {
        await load();
        return `Refreshed! **${total}** emails.`;
    }

    // SELECT ALL
    if (/select all/.test(t)) {
        emails.forEach(e => selected.add(e.id));
        render();
        return {text: `Selected **${selected.size}** emails.`, actions: [{label:'Delete all', cmd:'delete them'}, {label:'Clear', cmd:'clear'}]};
    }

    // CLEAR
    if (/^clear$|deselect|unselect/.test(t)) {
        selected.clear();
        render();
        return "Cleared.";
    }

    // DELETE
    if (/delete|remove|trash|get rid/.test(t)) {
        // Delete selected
        if (selected.size > 0 && /them|selected|these|those/.test(t)) {
            return await doDelete([...selected].map(id => emails.find(e => e.id === id)).filter(Boolean), 'selected');
        }
        // Delete newsletters
        if (/newsletter/.test(t)) {
            const list = emails.filter(isNL);
            if (!list.length) return "No newsletters found.";
            if (list.length > 3) { pending = {list, name: 'newsletters'}; return {text: `Delete **${list.length}** newsletters?`, actions: [{label:'Yes', cmd:'yes'}, {label:'No', cmd:'no'}]}; }
            return await doDelete(list, 'newsletters');
        }
        // Delete by sender/domain
        const match = findSender(t);
        if (match.list.length) {
            if (match.list.length > 3) { pending = {list: match.list, name: match.name}; return {text: `Delete **${match.list.length}** from "${match.name}"?`, actions: [{label:'Yes', cmd:'yes'}, {label:'No', cmd:'no'}]}; }
            return await doDelete(match.list, match.name);
        }
        return {text: "Delete what?", actions: [{label:'Newsletters', cmd:'delete newsletters'}, {label:'Selected', cmd:'delete them'}]};
    }

    // ARCHIVE
    if (/archive/.test(t)) {
        if (selected.size > 0 && /them|selected/.test(t)) {
            return await doArchive([...selected].map(id => emails.find(e => e.id === id)).filter(Boolean));
        }
        const match = findSender(t);
        if (match.list.length) return await doArchive(match.list, match.name);
        return "Archive what? Select emails first or specify a sender.";
    }

    // TAG
    if (/tag|mark|label/.test(t)) {
        if (!selected.size) return "Select emails first.";
        const type = /important/.test(t) ? 'important' : /respond|reply/.test(t) ? 'respond' : /later/.test(t) ? 'later' : null;
        if (type) {
            selected.forEach(id => tags[id] = type);
            localStorage.setItem('felixTags', JSON.stringify(tags));
            const c = selected.size; selected.clear(); render(); updateStats();
            return `Tagged **${c}** as ${type}.`;
        }
        return {text: "Tag as what?", actions: [{label:'Respond', cmd:'tag respond'}, {label:'Important', cmd:'tag important'}, {label:'Later', cmd:'tag later'}]};
    }

    // THANKS
    if (/thanks|thank you|thx|cheers/.test(t)) {
        return "You're welcome!";
    }

    // Try to find sender in the message (fallback)
    const match = findSender(t);
    if (match.list.length) {
        match.list.forEach(e => selected.add(e.id));
        render();
        return {text: `Found **${match.list.length}** from "${match.name}".`, actions: [{label:'Delete', cmd:'delete them'}, {label:'Archive', cmd:'archive them'}]};
    }

    // Ultimate fallback - always helpful
    return {text: `I can help! Try:`, actions: [{label:'Show suggestions', cmd:'suggest'}, {label:'Delete newsletters', cmd:'delete newsletters'}, {label:'Help', cmd:'help'}]};
}

function findSender(text) {
    // Remove common words
    const clean = text.replace(/\b(delete|archive|remove|show|find|get|from|all|the|emails?|please)\b/gi, '').trim();
    const words = clean.split(/\s+/).filter(w => w.length > 2);

    for (const word of words) {
        const w = word.toLowerCase().replace(/['".,!?]/g, '');
        const list = emails.filter(e => {
            const sender = (e.sender||'').toLowerCase();
            const name = (e.senderName||'').toLowerCase();
            return sender.includes(w) || name.includes(w);
        });
        if (list.length) return {list, name: w};
    }
    return {list: [], name: ''};
}

function isNL(e) {
    const s = (e.sender||'').toLowerCase();
    const subj = (e.subject||'').toLowerCase();
    return /newsletter|noreply|no-reply|marketing|digest|weekly|notify|updates@|info@|hello@/.test(s) || /unsubscribe|newsletter|weekly|digest/.test(subj);
}

async function doDelete(list, name) {
    for (const e of list) {
        await fetch(API + '/emails/action', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({emailId: e.id, action: 'delete'})}).catch(()=>{});
    }
    const ids = new Set(list.map(e => e.id));
    emails = emails.filter(e => !ids.has(e.id));
    total -= list.length;
    selected = new Set([...selected].filter(id => !ids.has(id)));
    render();
    updateStats();
    return `Deleted **${list.length}** ${name ? `from "${name}"` : 'emails'}. ${total ? `**${total}** left.` : '🎉 Inbox Zero!'}`;
}

async function doArchive(list, name) {
    for (const e of list) {
        await fetch(API + '/emails/action', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({emailId: e.id, action: 'archive'})}).catch(()=>{});
    }
    const ids = new Set(list.map(e => e.id));
    emails = emails.filter(e => !ids.has(e.id));
    total -= list.length;
    selected = new Set([...selected].filter(id => !ids.has(id)));
    render();
    updateStats();
    return `Archived **${list.length}** ${name ? `from "${name}"` : 'emails'}.`;
}
</script>
</body>
</html>
